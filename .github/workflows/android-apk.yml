name: Android Release

on:
  push:
    tags:
      - "v*"
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 1.0"
        required: true
        default: "1.0"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # Epic v3 S0.4：PR / main 上的结构门禁。release 链（build/release）只在 tag 与手动触发时跑，
  # 靠下面的 if 条件隔开，避免 PR 触发签名构建。
  verify:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android packages
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Unit tests
        run: ./gradlew :mobile:testDebugUnitTest --no-daemon --console=plain

      - name: Lint (baseline：只拦新增)
        run: ./gradlew :mobile:lintDebug --no-daemon --console=plain

      # 逐 Slice 门禁：未达标指标只报告 + 棘轮防劣化；全量 --strict 作为 P7 DoD 单独列出
      - name: Structure audit (ratchet)
        run: |
          python3 outputs/research/frontend-audit.py
          python3 outputs/research/frontend-bare-read-check.py

      - name: Structure audit (strict, report only)
        continue-on-error: true
        run: python3 outputs/research/frontend-audit.py --strict

  build:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release_meta.outputs.version }}
      tag_name: ${{ steps.release_meta.outputs.tag_name }}
      apk_name: ${{ steps.release_meta.outputs.apk_name }}
      apk_path: ${{ steps.release_meta.outputs.apk_path }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android packages
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Decode Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "${KEYSTORE_BASE64}" ]; then
            echo "${KEYSTORE_BASE64}" | base64 --decode > mobile/release.jks
          fi

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :mobile:assembleRelease --no-daemon --stacktrace

      - name: Prepare release asset
        id: release_meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            raw_version="${GITHUB_REF_NAME}"
          else
            raw_version="${{ inputs.version }}"
          fi

          version="${raw_version#v}"
          tag_name="v${version}"
          apk_name="artplus-mobile-${version}.apk"

          mkdir -p release
          cp mobile/build/outputs/apk/release/mobile-release.apk "release/${apk_name}"

          {
            echo "version=${version}"
            echo "tag_name=${tag_name}"
            echo "apk_name=${apk_name}"
            echo "apk_path=release/${apk_name}"
          } >> "${GITHUB_OUTPUT}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: artplus-mobile-${{ steps.release_meta.outputs.version }}
          path: ${{ steps.release_meta.outputs.apk_path }}

  release:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Checkout (for release notes)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: artplus-mobile-${{ needs.build.outputs.version }}
          path: release

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.build.outputs.tag_name }}
          VERSION: ${{ needs.build.outputs.version }}
          APK_NAME: ${{ needs.build.outputs.apk_name }}
        shell: bash
        run: |
          APK_PATH="release/${APK_NAME}"
          if [[ ! -f "${APK_PATH}" ]]; then
            APK_PATH=$(find release -maxdepth 2 -type f -name "*.apk" | head -n 1)
          fi
          echo "Using APK: ${APK_PATH}"
          NOTES_CANDIDATE="docs/release-notes/${VERSION}.md"
          if [[ -f "${NOTES_CANDIDATE}" ]]; then
            cp "${NOTES_CANDIDATE}" release-notes.md
            echo "Using ${NOTES_CANDIDATE} as release notes"
          else
            {
              echo "ArtPlus ${VERSION}"
              echo
              echo "- Built by GitHub Actions."
              echo "- Release build signed with the official ArtPlus release key."
              echo "- APK: $(basename "${APK_PATH}")"
            } > release-notes.md
          fi

          if gh release view "${TAG_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${TAG_NAME}" "${APK_PATH}" --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${TAG_NAME}" "${APK_PATH}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --title "ArtPlus ${VERSION}" \
              --notes-file release-notes.md \
              --latest
          fi
