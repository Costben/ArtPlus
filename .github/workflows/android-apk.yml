name: Android Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 1.0"
        required: true
        default: "1.0"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release_meta.outputs.version }}
      tag_name: ${{ steps.release_meta.outputs.tag_name }}
      apk_name: ${{ steps.release_meta.outputs.apk_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android packages
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Decode Release Keystore
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "${KEYSTORE_BASE64}" | base64 --decode > mobile/release.jks

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :mobile:assembleRelease --no-daemon --stacktrace

      - name: Prepare release asset
        id: release_meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            raw_version="${GITHUB_REF_NAME}"
          else
            raw_version="${{ inputs.version }}"
          fi

          version="${raw_version#v}"
          tag_name="v${version}"
          apk_name="artplus-mobile-${version}.apk"

          mkdir -p release
          cp mobile/build/outputs/apk/release/mobile-release.apk "release/${apk_name}"

          {
            echo "version=${version}"
            echo "tag_name=${tag_name}"
            echo "apk_name=${apk_name}"
            echo "apk_path=release/${apk_name}"
          } >> "${GITHUB_OUTPUT}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: artplus-mobile-${{ steps.release_meta.outputs.version }}
          path: ${{ steps.release_meta.outputs.apk_path }}

  release:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Checkout (for release notes)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: artplus-mobile-${{ needs.build.outputs.version }}
          path: release

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.build.outputs.tag_name }}
          VERSION: ${{ needs.build.outputs.version }}
          APK_PATH: release/${{ needs.build.outputs.apk_name }}
        shell: bash
        run: |
          NOTES_CANDIDATE="docs/release-notes/${VERSION}.md"
          if [[ -f "${NOTES_CANDIDATE}" ]]; then
            cp "${NOTES_CANDIDATE}" release-notes.md
            echo "Using ${NOTES_CANDIDATE} as release notes"
          else
            {
              echo "ArtPlus ${VERSION}"
              echo
              echo "- Built by GitHub Actions."
              echo "- Release build signed with the official ArtPlus release key."
              echo "- APK: $(basename "${APK_PATH}")"
            } > release-notes.md
          fi

          if gh release view "${TAG_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${TAG_NAME}" "${APK_PATH}" --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${TAG_NAME}" "${APK_PATH}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --title "ArtPlus ${VERSION}" \
              --notes-file release-notes.md \
              --latest
          fi
